<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspeção de Extintores</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff4e8;color:#263443;margin:0}header{background:#fff;padding:18px;text-align:center;border-bottom:1px solid #edd9c5}h1{font-size:22px;margin:0}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e8d7c5;border-radius:12px;padding:16px;margin:12px 0}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{padding:11px 15px;border:0;border-radius:8px;background:#b75c1a;color:white;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}.secondary{background:#43576c}.danger{background:#9c3030}.item{padding:12px 0;border-bottom:1px solid #eee}.item strong{display:block;margin-bottom:8px}.options{display:flex;gap:8px;flex-wrap:wrap}.options label{margin:0;font-weight:normal;display:flex;align-items:center;gap:4px}.options input{width:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}small{color:#64748b}.summary{font-size:14px;color:#526070}.sugestoes{border:1px solid #ddd;border-radius:8px;max-height:220px;overflow:auto}.sugestoes:empty{display:none}.sugestoes button{display:block;width:100%;text-align:left;background:white;color:#263443;border-bottom:1px solid #eee;margin:0;border-radius:0;font-weight:normal}</style></head><body><header><h1>Inspeção de Extintores</h1></header><main><a href="index.html">← Voltar ao menu</a><div class="card"><label>Empresa / Fazenda</label><input id="empresa" placeholder="Digite para buscar a empresa" autocomplete="off"><input id="empresa-id" type="hidden"><div id="empresa-sugestoes" class="sugestoes"></div><p class="summary">Os locais são cadastrados conforme os extintores forem encontrados. A data da manutenção é individual.</p></div><div id="lista"></div><button id="adicionar">+ Adicionar extintor</button><button class="secondary" id="salvar">Salvar ronda</button><p id="aviso" role="status"></p><small>Salvamento automático neste aparelho para continuar a ronda sem internet.</small></main><script>
const CHAVE='checklist_extintores_ronda_v1';
const CACHE_EMPRESAS='checklist_extintores_empresas_v1',CACHE_LOCAIS='checklist_extintores_locais_v1';
function lerCache(chave){try{const lista=JSON.parse(localStorage.getItem(chave)||'[]');return Array.isArray(lista)?lista:[]}catch(e){return []}}
function guardarCache(chave,valor){try{localStorage.setItem(chave,JSON.stringify(valor))}catch(e){console.warn('Não foi possível atualizar os cadastros locais.',e)}}
const perguntas=['Extintor instalado no local previsto?','Acesso livre e desobstruído?','Sinalização visível e adequada?','Altura e instalação adequadas?','Adequado à classe de incêndio?','Lacre e dispositivo de segurança íntegros?','Manômetro na faixa de operação (quando existente)?','Mangueira, bico e componentes íntegros?','Cilindro sem corrosão, danos ou vazamento aparente?','Rótulo e instruções legíveis?','Etiqueta de manutenção legível?','Manutenção dentro do prazo aplicável?','Identificação e rastreabilidade disponíveis?','Condições gerais adequadas?'];
let dados={empresa:'',empresa_id:'',extintores:[]};try{const salvo=JSON.parse(localStorage.getItem(CHAVE));if(salvo&&Array.isArray(salvo.extintores))dados=salvo}catch(e){}
const lista=document.getElementById('lista'),empresa=document.getElementById('empresa');empresa.value=dados.empresa;const empresaId=document.getElementById('empresa-id'),sugestoes=document.getElementById('empresa-sugestoes');empresaId.value=dados.empresa_id||'';let empresas=lerCache(CACHE_EMPRESAS),locaisCadastrados=lerCache(CACHE_LOCAIS);async function carregarLocais(){try{const r=await fetch('https://uofnninqxnsvaemxpwhh.supabase.co/rest/v1/checklist_locais?select=id,nome&ativo=eq.true&order=nome.asc',{headers:{apikey:'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8',Authorization:'Bearer sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8'}});if(!r.ok)throw new Error('HTTP '+r.status);locaisCadastrados=await r.json();guardarCache(CACHE_LOCAIS,locaisCadastrados)}catch(e){if(!locaisCadastrados.length)document.getElementById('aviso').textContent='Sem conexão com os locais cadastrados. Você pode informar o local manualmente.'}}carregarLocais();const normalizar=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();async function carregarEmpresas(){try{const r=await fetch('https://uofnninqxnsvaemxpwhh.supabase.co/rest/v1/empresas?select=id,nome&ativo=eq.true&order=nome.asc',{headers:{apikey:'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8',Authorization:'Bearer sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8'}});if(!r.ok)throw new Error('HTTP '+r.status);empresas=await r.json();guardarCache(CACHE_EMPRESAS,empresas);empresa.placeholder='Digite o nome da empresa';}catch(e){document.getElementById('aviso').textContent=empresas.length?'Usando as empresas guardadas neste aparelho.':'Sem empresas carregadas neste aparelho. Conecte uma vez para carregar a lista.'}}function sugerir(){empresaId.value='';sugestoes.replaceChildren();const q=normalizar(empresa.value.trim());if(!q)return;empresas.filter(e=>normalizar(e.nome).includes(q)).slice(0,20).forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e.nome;b.onclick=()=>{empresa.value=e.nome;empresaId.value=e.id;sugestoes.replaceChildren();salvarLocal()};sugestoes.append(b)});if(!sugestoes.children.length)sugestoes.textContent='Nenhuma empresa encontrada.'}empresa.addEventListener('input',sugerir);carregarEmpresas();
function novo(){return {id:crypto.randomUUID(),local:'',tipo:'',capacidade:'',serie:'',manutencao:'',respostas:{},observacao:''}}
function render(){lista.replaceChildren();dados.extintores.forEach((e,i)=>{const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent='EXT-'+String(i+1).padStart(3,'0');card.append(h);const grid=document.createElement('div');grid.className='grid';card.append(grid);
function campo(nome,chave,tipo='text'){const wrap=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');label.textContent=nome;input.type=tipo;input.value=e[chave]||'';input.addEventListener('input',()=>{e[chave]=input.value});wrap.append(label,input);grid.append(wrap)}
const localWrap=document.createElement('div'),localLabel=document.createElement('label'),localInput=document.createElement('input'),localLista=document.createElement('div');localLabel.textContent='Local / Setor';localInput.value=e.local||'';localInput.placeholder='Digite para buscar ou informar novo local';localLista.className='sugestoes';localWrap.append(localLabel,localInput,localLista);grid.append(localWrap);function buscarLocal(){e.local=localInput.value;e.local_mestre_id=null;localLista.replaceChildren();const q=normalizar(localInput.value.trim());if(!q)return;locaisCadastrados.filter(l=>normalizar(l.nome).includes(q)).slice(0,15).forEach(l=>{const b=document.createElement('button');b.type='button';b.textContent=l.nome;b.onclick=()=>{localInput.value=l.nome;e.local=l.nome;e.local_mestre_id=l.id;localLista.replaceChildren();salvarLocal()};localLista.append(b)})}localInput.addEventListener('input',buscarLocal);campo('Tipo de extintor','tipo');campo('Capacidade','capacidade');campo('Número de série','serie');campo('Data da manutenção','manutencao','date');
perguntas.forEach((p,j)=>{const div=document.createElement('div');div.className='item';const strong=document.createElement('strong');strong.textContent=(j+1)+'. '+p;div.append(strong);const options=document.createElement('div');options.className='options';['C','NC','P','NA'].forEach(v=>{const lab=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name=e.id+'-'+j;radio.value=v;radio.checked=e.respostas[j]===v;radio.addEventListener('change',()=>e.respostas[j]=v);lab.append(radio,document.createTextNode(v));options.append(lab)});div.append(options);card.append(div)});
const lab=document.createElement('label');lab.textContent='Observações';const area=document.createElement('textarea');area.rows=3;area.value=e.observacao||'';area.addEventListener('input',()=>e.observacao=area.value);card.append(lab,area);const remove=document.createElement('button');remove.className='danger';remove.textContent='Excluir extintor';remove.onclick=()=>{if(confirm('Excluir este extintor da ronda?')){dados.extintores.splice(i,1);render();salvarLocal()}};card.append(remove);lista.append(card)})}
function coletar(){dados.empresa=empresa.value.trim();dados.empresa_id=empresaId.value;return dados}
document.getElementById('adicionar').onclick=()=>{dados.extintores.push(novo());render();salvarLocal()};
let houveEdicao=false,sequenciaSalvamento=0;
const backupLocal=new Promise((resolve,reject)=>{
  const pedido=indexedDB.open('sst-vision-extintores',1);
  pedido.onupgradeneeded=()=>pedido.result.createObjectStore('rondas',{keyPath:'id'});
  pedido.onsuccess=()=>resolve(pedido.result);pedido.onerror=()=>reject(pedido.error);
});
function acessarBackup(modo,operacao){return backupLocal.then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('rondas',modo),pedido=operacao(tx.objectStore('rondas'));tx.oncomplete=()=>resolve(pedido.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Gravação interrompida'))}))}
acessarBackup('readonly',store=>store.get('atual')).then(salvo=>{
  if(houveEdicao||!salvo?.dados||!Array.isArray(salvo.dados.extintores))return;
  if((salvo.dados.atualizado_em||'')>(dados.atualizado_em||'')){
    dados=salvo.dados;empresa.value=dados.empresa||'';empresaId.value=dados.empresa_id||'';render();
    document.getElementById('aviso').textContent='Ronda recuperada deste aparelho.';
  }
}).catch(e=>console.warn('Cópia local adicional indisponível; usando o salvamento do navegador.',e));
function salvarLocal(){
  houveEdicao=true;const sequencia=++sequenciaSalvamento;
  const copia=JSON.parse(JSON.stringify({...coletar(),atualizado_em:new Date().toISOString()}));dados.atualizado_em=copia.atualizado_em;
  const aviso=document.getElementById('aviso');let salvoNoNavegador=false;
  const concluido=()=>{if(sequencia===sequenciaSalvamento)aviso.textContent='Ronda guardada automaticamente neste aparelho às '+new Date(copia.atualizado_em).toLocaleTimeString('pt-BR')+'.'};
  try{localStorage.setItem(CHAVE,JSON.stringify(copia));salvoNoNavegador=true;concluido()}catch(e){aviso.textContent='Guardando a ronda no armazenamento do aparelho...'}
  acessarBackup('readwrite',store=>store.put({id:'atual',dados:copia})).then(concluido).catch(e=>{
    if(!salvoNoNavegador&&sequencia===sequenciaSalvamento)aviso.textContent='Não foi possível guardar a ronda: '+e.message+'. Mantenha esta página aberta e tente novamente.';
  });
  return salvoNoNavegador;
}
document.addEventListener('input',salvarLocal);document.addEventListener('change',salvarLocal);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')salvarLocal()});
window.addEventListener('pagehide',salvarLocal);
document.getElementById('salvar').onclick=salvarLocal;
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=9').catch(e=>console.warn('Offline: não foi possível preparar os arquivos.',e)));

render();
</script></body></html>
