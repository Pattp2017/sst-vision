const lista=document.getElementById('lista'),empresa=document.getElementById('empresa');const empresaId=document.getElementById('empresa-id'),sugestoes=document.getElementById('empresa-sugestoes');let empresas=lerCache(CACHE_EMPRESAS),locaisCadastrados=lerCache(CACHE_LOCAIS);async function carregarLocais(){try{const r=await fetch('https://uofnninqxnsvaemxpwhh.supabase.co/rest/v1/checklist_locais?select=id,nome&ativo=eq.true&order=nome.asc',{headers:{apikey:'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8',Authorization:'Bearer sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8'}});if(!r.ok)throw new Error('HTTP '+r.status);locaisCadastrados=await r.json();guardarCache(CACHE_LOCAIS,locaisCadastrados)}catch(e){if(!locaisCadastrados.length)document.getElementById('aviso').textContent='Sem conexão com os locais cadastrados. Você pode informar o local manualmente.'}}const normalizar=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();async function carregarEmpresas(){try{const r=await fetch('https://uofnninqxnsvaemxpwhh.supabase.co/rest/v1/empresas?select=id,nome&ativo=eq.true&order=nome.asc',{headers:{apikey:'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8',Authorization:'Bearer sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8'}});if(!r.ok)throw new Error('HTTP '+r.status);empresas=await r.json();guardarCache(CACHE_EMPRESAS,empresas);empresa.placeholder='Digite o nome da empresa';}catch(e){document.getElementById('aviso').textContent=empresas.length?'Usando as empresas guardadas neste aparelho.':'Sem empresas carregadas neste aparelho. Conecte uma vez para carregar a lista.'}}function sugerir(){empresaId.value='';sugestoes.replaceChildren();const q=normalizar(empresa.value.trim());if(!q)return;empresas.filter(e=>normalizar(e.nome).includes(q)).slice(0,20).forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e.nome;b.onclick=()=>{empresa.value=e.nome;empresaId.value=e.id;sugestoes.replaceChildren();salvarLocal().catch(() => {})};sugestoes.append(b)});if(!sugestoes.children.length)sugestoes.textContent='Nenhuma empresa encontrada.'}empresa.addEventListener('input',sugerir);
async function reduzirFoto(arquivo){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(arquivo);
  img.onload=()=>{try{const max=1100,escala=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*escala);canvas.height=Math.round(img.height*escala);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.65))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};

 })
}

 try{if(!arquivo.type.startsWith('image/'))throw Error('Selecione uma imagem do mapa.');const ronda=dados;const imagem=await reduzirFoto(arquivo);if(ronda!==dados)return;dados.mapa_imagem=imagem;exibirMapa();await salvarLocal()}catch(e){document.getElementById('aviso').textContent='Erro ao anexar mapa: '+e.message}finally{ev.target.value=''}
};

const abasExtintores = document.getElementById('extintor-abas');
let indiceExtintor = 0;
const CHAVE_EDITOR_EXTINTORES = 'checklist_extintores_editor';

function guardarPosicaoExtintor(rolagem = null) {
  try {
    if (!ativa) {
      sessionStorage.removeItem(CHAVE_EDITOR_EXTINTORES);
      return;
    }
    sessionStorage.setItem(CHAVE_EDITOR_EXTINTORES, JSON.stringify({
      ronda: ativa.id,
      extintor: dados.extintores[indiceExtintor]?.id,
      rolagem
    }));
  } catch {
    // A seleção continua disponível enquanto o editor permanecer aberto.
  }
}

async function restaurarEditorExtintores() {
  let posicao;
  try {
    posicao = JSON.parse(sessionStorage.getItem(CHAVE_EDITOR_EXTINTORES));
  } catch {
    return;
  }
  if (!posicao?.ronda) return;
  const ronda = await Extintores.obter(posicao.ronda);
  if (!ronda || ronda.dados.status === 'excluida') {
    guardarPosicaoExtintor();
    return;
  }
  mostrarEditor(ronda, posicao.extintor);
  if (Number.isFinite(posicao.rolagem)) {
    requestAnimationFrame(() => {
      if (ativa === ronda) window.scrollTo(0, posicao.rolagem);
    });
  }
}

function selecionarExtintor(indice, focar = false) {
  indiceExtintor = indice;
  for (const [posicao, aba] of Array.from(abasExtintores.children).entries()) {
    const selecionada = posicao === indice;
    aba.setAttribute('aria-selected', String(selecionada));
    aba.tabIndex = selecionada ? 0 : -1;
  }
  for (const [posicao, painel] of Array.from(lista.children).entries()) {
    painel.hidden = posicao !== indice;
  }
  if (!lista.children[indice]?.firstChild) renderExtintor();
  guardarPosicaoExtintor();
  const aba = abasExtintores.children[indice];
  if (aba && focar) {
    aba.focus({preventScroll: true});
    aba.scrollIntoView({block: 'nearest', inline: 'nearest'});
  }
}

abasExtintores.addEventListener('keydown', evento => {
  const total = dados.extintores.length;
  let indice;
  switch (evento.key) {
    case 'ArrowLeft': indice = (indiceExtintor - 1 + total) % total; break;
    case 'ArrowRight': indice = (indiceExtintor + 1) % total; break;
    case 'Home': indice = 0; break;
    case 'End': indice = total - 1; break;
    default: return;
  }
  evento.preventDefault();
  selecionarExtintor(indice, true);
});

function render(focar = false) {
  abasExtintores.replaceChildren();
  lista.replaceChildren();
  abasExtintores.hidden = !dados.extintores.length;
  dados.extintores.forEach((_, indice) => {
    const aba = document.createElement('button');
    aba.type = 'button';
    aba.id = 'extintor-aba-' + indice;
    aba.textContent = 'EXT-' + String(indice + 1).padStart(3, '0');
    aba.setAttribute('role', 'tab');
    aba.setAttribute('aria-controls', 'extintor-painel-' + indice);
    aba.onclick = () => selecionarExtintor(indice, true);
    abasExtintores.append(aba);

    const painel = document.createElement('section');
    painel.className = 'card';
    painel.id = 'extintor-painel-' + indice;
    painel.setAttribute('role', 'tabpanel');
    painel.setAttribute('aria-labelledby', aba.id);
    painel.tabIndex = 0;
    lista.append(painel);
  });
  selecionarExtintor(Math.max(0, Math.min(indiceExtintor, dados.extintores.length - 1)), focar);
}

function renderExtintor() {

  const grid = document.createElement('div');
  grid.className = 'grid';
  card.append(grid);
function campo(nome,chave,tipo='text'){const wrap=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');label.textContent=nome;input.type=tipo;input.value=tipo==='month'?(e[chave]||'').slice(0,7):(e[chave]||'');input.addEventListener('input',()=>{e[chave]=input.value});wrap.append(label,input);grid.append(wrap)}
const localWrap=document.createElement('div'),localLabel=document.createElement('label'),localInput=document.createElement('input'),localLista=document.createElement('div');localLabel.textContent='Local / Setor';localInput.value=e.local||'';localInput.placeholder='Digite para buscar ou informar novo local';localLista.className='sugestoes';localWrap.append(localLabel,localInput,localLista);grid.append(localWrap);function buscarLocal(){e.local=localInput.value;e.local_mestre_id=null;localLista.replaceChildren();const q=normalizar(localInput.value.trim());if(!q)return;locaisCadastrados.filter(l=>normalizar(l.nome).includes(q)).slice(0,15).forEach(l=>{const b=document.createElement('button');b.type='button';b.textContent=l.nome;b.onclick=()=>{localInput.value=l.nome;e.local=l.nome;e.local_mestre_id=l.id;localLista.replaceChildren()};localLista.append(b)})}localInput.addEventListener('input',buscarLocal);campo('Tipo de extintor','tipo');campo('Capacidade','capacidade');campo('Número de série','serie');campo('Mês e ano da manutenção','manutencao','month');
itensDaRonda().forEach(({descricao:p, medida_corretiva_recomendada:medida},j)=>{e.respostas=e.respostas||{};if(e.respostas[j]===undefined||e.respostas[j]===null||e.respostas[j]==='')e.respostas[j]='C';const div=document.createElement('div');div.className='item';const strong=document.createElement('strong');strong.textContent=(j+1)+'. '+p;div.append(strong);const options=document.createElement('div');options.className='options';['C','NC','P','NA'].forEach(v=>{const lab=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name=e.id+'-'+j;radio.value=v;radio.checked=e.respostas[j]===v;radio.addEventListener('change',()=>{e.respostas[j]=v;if(v==='NC'){e.detalhes=e.detalhes||{};e.detalhes[j]=e.detalhes[j]||{};if(!e.detalhes[j].recomendacao)e.detalhes[j].recomendacao=medida||''}renderExtintor();lista.children[i].querySelectorAll('.options')[j].querySelector('input:checked')?.focus({preventScroll:true});salvarLocal().catch(() => {})});lab.append(radio,document.createTextNode(v));options.append(lab)});div.append(options);
if(e.respostas[j]==='NC'){
 e.detalhes=e.detalhes||{};e.detalhes[j]=e.detalhes[j]||{};
 const det=e.detalhes[j];
 if(!det.recomendacao)det.recomendacao=medida||'';
 const titulo=document.createElement('label');titulo.textContent='Constatação da não conformidade';
 const obs=document.createElement('textarea');obs.rows=2;obs.value=det.observacao||'';obs.placeholder='Descreva a irregularidade encontrada';obs.oninput=()=>det.observacao=obs.value;

 div.append(titulo,obs,tituloRec,rec);
 const fotosTitulo=document.createElement('strong');

 const camera=criarEntradaFoto('Tirar foto', true);

 function criarEntradaFoto(texto, usarCamera) {
  const rotulo=document.createElement('label');
  rotulo.textContent=texto;
  const entrada=document.createElement('input');

 }
 const fotosPreview=document.createElement('div');fotosPreview.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px';

 }

function coletar(){dados.proxima_visita=document.getElementById('proxima-visita').value;dados.responsavel=document.getElementById('responsavel').value.trim();dados.empresa=empresa.value.trim();dados.empresa_id=empresaId.value;return dados}

const $ = id => document.getElementById(id);
let ativa;
let nuvem = new Map();
const conflitos = new Set();
let sincronizando;
let agendamento;
let operacao = false;
let excluindo = false;
let fotosEmProcessamento = 0;
let salvandoRonda = false;

function atualizarBotoesEditor() {
  const ocupado = fotosEmProcessamento > 0 || salvandoRonda;
  for (const id of ['voltar-rondas', 'finalizar', 'salvar', 'salvar-geral-topo']) {
    $(id).disabled = ocupado;
  }
}

function atualizarFotosEmProcessamento(variacao) {
  fotosEmProcessamento += variacao;
  atualizarBotoesEditor();
}
const aviso = mensagem => { $('sync-status').textContent = mensagem; };

function solicitarSync() {
  clearTimeout(agendamento);
  agendamento = setTimeout(() => sincronizar(), 900);
}

function mostrarEditor(ronda, extintorId) {
  ativa = ronda;
  dados = ronda.dados;
  indiceExtintor = extintorId
    ? Math.max(0, dados.extintores.findIndex(extintor => extintor.id === extintorId))
    : 0;
  Extintores.identificarFotos(dados);
  empresa.value = dados.empresa || '';
  empresaId.value = dados.empresa_id || '';
  $('responsavel').value = dados.responsavel || '';
  $('data-inspecao').value = dados.data_inspecao;
  $('proxima-visita').value = dados.proxima_visita || '';
  sugestoes.replaceChildren();
  $('aviso').textContent = '';
  $('aviso-salvar-topo').textContent = '';
  $('gestao').hidden = true;
  $('editor').hidden = false;
  const fechada = dados.status === 'finalizada';
  $('dados-gerais').disabled = fechada;
  $('campos').disabled = fechada;
  $('finalizar').hidden = fechada;
  $('salvar-geral-topo').hidden = fechada;
  $('salvar').hidden = fechada;
  exibirMapa();
  render();
}

async function mostrarGestao() {
  ativa = null;
  guardarPosicaoExtintor();
  $('editor').hidden = true;
  $('gestao').hidden = false;
  await listar();
}

function salvarLocal() {
  if (!ativa || $('campos').disabled) return Promise.resolve();
  coletar();
  dados.data_inspecao = $('data-inspecao').value || Extintores.dataLocal();
  if (!Extintores.possuiDados(dados) && !ativa.pendente && !ativa.base) return Promise.resolve();
  dados.atualizado_em = new Date(Math.max(Date.now(), Date.parse(dados.atualizado_em || 0) + 1 || 0)).toISOString();
  dados.revisao = crypto.randomUUID();
  ativa.pendente = true;
  const copia = structuredClone(ativa);
  return Extintores.gravar(copia).then(() => {
    if (ativa?.id === copia.id && ativa.dados.revisao === copia.dados.revisao) {
      $('aviso').textContent = 'Ronda guardada neste aparelho. ' +
        (dados.empresa_id ? '' : 'Selecione a empresa na lista para sincronizar.');
    }
    solicitarSync();
  }).catch(erro => {
    $('aviso').textContent = 'Falha ao salvar neste aparelho. Mantenha a tela aberta e tente novamente.';
    throw erro;
  });
}

async function listar() {
  const registros = new Map(nuvem);
  for (const r of await Extintores.locais()) {
    const remoto = nuvem.get(r.id);
    if (!r.pendente && remoto && remoto.atualizado_em !== r.base) continue;
    registros.set(r.id, {
      id: r.id, empresa_nome: r.dados.empresa, responsavel: r.dados.responsavel,
      data_inspecao: r.dados.data_inspecao, atualizado_em: r.dados.atualizado_em,
      status: r.dados.status, pendente: r.pendente
    });
  }
  const busca = normalizar($('busca').value);
  const status = $('filtro-status').value;
  const linhas = $('rondas');
  linhas.replaceChildren();
  const ordenados = [...registros.values()].sort((a, b) => Date.parse(b.atualizado_em) - Date.parse(a.atualizado_em));
  for (const r of ordenados) {
    if (r.status === 'excluida' || nuvem.get(r.id)?.status === 'excluida') continue;
    if (!normalizar(r.empresa_nome).includes(busca)) continue;
    const situacao = r.status || 'andamento';
    if (status && situacao !== status) continue;
    const linha = linhas.insertRow();
    const valores = [
      r.empresa_nome || 'Empresa a identificar',
      (situacao === 'finalizada' ? 'Finalizada' : 'Em andamento') + (r.pendente ? ' · Pendente de sincronização' : ''),
      r.data_inspecao?.slice(0, 10).split('-').reverse().join('/') || '—',
      r.atualizado_em ? new Date(r.atualizado_em).toLocaleString('pt-BR') : '—',
      r.responsavel || '—'
    ];
    valores.forEach(valor => { linha.insertCell().textContent = valor; });
    const acoes = linha.insertCell();
    for (const [rotulo, relatorio] of [[situacao === 'finalizada' ? 'Abrir' : 'Continuar', false], ['Relatório', true]]) {
      const botao = document.createElement('button');
      botao.textContent = rotulo;
      botao.onclick = () => abrir(r.id, relatorio);
      acoes.append(botao);
    }
    const excluir = document.createElement('button');
    excluir.type = 'button';
    excluir.className = 'danger';
    excluir.textContent = 'Excluir inspeção';
    excluir.onclick = () => excluirInspecao(r);
    const temConflito = r.pendente && conflitos.has(r.id);
    if (!temConflito) acoes.append(excluir);

    if (temConflito) {
      const botao = document.createElement('button');
      botao.textContent = 'Salvar como nova inspeção';
      botao.onclick = () => salvarComoNova(r.id);
      acoes.append(botao);
      const descartar = document.createElement('button');
      descartar.type = 'button';
      descartar.className = 'secondary';
      descartar.textContent = 'Descartar cópia local';
      descartar.onclick = () => excluirInspecao(r, true);
      acoes.append(descartar);
    }
  }
  $('sem-rondas').hidden = Boolean(linhas.rows.length);
}

async function abrir(id, relatorio) {
  if (operacao) return;
  operacao = true;
  try {
    let ronda = await Extintores.obter(id);
    if (navigator.onLine && !ronda?.pendente) {
      try {
        const atual = nuvem.get(id);
        if (!ronda || !atual || atual.atualizado_em !== ronda.base) {
          const baixada = await Extintores.baixar(id);
          if (baixada) {
            await Extintores.gravar(baixada);
            ronda = baixada;
          }
        }
      } catch (erro) {
        if (!ronda) throw erro;
        aviso('Usando a cópia deste aparelho. ' + erro.message);
      }
    }
    if (ronda?.dados.status === 'excluida' || nuvem.get(id)?.status === 'excluida') {
      throw Error('Esta inspeção foi excluída do histórico.');
    }
    if (!ronda) throw Error('Conecte-se para baixar esta inspeção.');
    if (relatorio) location.href = 'relatorio-extintores.html?id=' + encodeURIComponent(id);
    else mostrarEditor(ronda);
  } catch (erro) {
    aviso(erro.message);
  } finally {
    operacao = false;
  }
}

async function excluirInspecao(registro, apenasLocal = false) {
  if (operacao) return;
  if (!navigator.onLine) {
    aviso('Conecte-se para confirmar qual versão da inspeção está no histórico.');
    return;
  }
  const mensagem = apenasLocal
    ? 'Descartar as alterações desta inspeção guardadas neste aparelho? A versão no histórico será mantida.'
    : 'Excluir a inspeção de ' + (registro.empresa_nome || 'empresa a identificar') +
      ' (' + (registro.data_inspecao || 'sem data') + ') do histórico compartilhado?';
  if (!confirm(mensagem)) return;

  operacao = true;
  excluindo = true;
  try {
    await sincronizando;
    const remota = await Extintores.baixar(registro.id);
    if (!apenasLocal && remota && registro.pendente &&
        remota.dados.data_inspecao !== registro.data_inspecao) {
      conflitos.add(registro.id);
      throw Error('As datas da cópia local e da ronda compartilhada são diferentes.');
    }
    if (!apenasLocal && remota && remota.dados.status !== 'excluida') {
      remota.dados.status = 'excluida';
      remota.dados.revisao = crypto.randomUUID();
      remota.dados.atualizado_em = new Date(
        Math.max(Date.now(), Date.parse(remota.base) + 1)
      ).toISOString();
      remota.base = await Extintores.enviar(remota);
    }
    if (remota) {
      await Extintores.gravar(remota);
      nuvem.set(registro.id, {
        ...registro, status: remota.dados.status, atualizado_em: remota.base
      });
    } else {
      await Extintores.removerLocal(registro.id);
      nuvem.delete(registro.id);
    }
    conflitos.delete(registro.id);
    aviso(apenasLocal ? 'Cópia local descartada.' : 'Inspeção excluída do histórico.');
  } catch (erro) {
    aviso('Não foi possível concluir a exclusão. ' + erro.message);
  } finally {
    operacao = false;
    excluindo = false;
    await listar();
  }
}

async function salvarComoNova(id) {
  if (operacao) return;
  operacao = true;
  try {
    const ronda = await Extintores.obter(id);
    if (ronda?.pendente && await Extintores.separarRonda(ronda)) conflitos.delete(id);
    await sincronizar();
    solicitarSync();
  } catch (erro) {
    aviso('Não foi possível salvar a inspeção como nova. ' + erro.message);
  } finally {
    operacao = false;
  }
}

async function enviarRonda(ronda) {
  try {
    const base = await Extintores.enviar(ronda);
    conflitos.delete(ronda.id);
    return {ronda, base};
  } catch (erro) {
    if (!erro.conflito) throw erro;
    conflitos.add(ronda.id);
    throw erro;
  }
}

function sincronizar() {
  if (sincronizando) return sincronizando;
  if (excluindo) return Promise.resolve();
  sincronizando = (async () => {
    if (!navigator.onLine) {
      aviso('Sem internet. As alterações ficam guardadas neste aparelho.');
      return;
    }
    try {
      const falhas = [];
      nuvem = new Map((await Extintores.listar()).map(r => [r.id, r]));
      let enviou = false;
      for (const ronda of await Extintores.locais()) {
        if (nuvem.get(ronda.id)?.status === 'excluida') {
          if (!ronda.pendente && ativa?.id !== ronda.id) await Extintores.removerLocal(ronda.id);
          continue;
        }
        if (!ronda.pendente) continue;
        if (!ronda.dados.empresa_id) {
          const matches = empresas.filter(e => normalizar(e.nome) === normalizar(ronda.dados.empresa));
          if (matches.length !== 1) continue;
          ronda.dados.empresa_id = matches[0].id;
        }
        try {
          const {ronda: enviada, base} = await enviarRonda(ronda);
          await Extintores.confirmar(enviada, base);
          enviou = true;
          if (ativa?.id === enviada.id) {
            ativa.base = base;
            ativa.pendente = ativa.dados.revisao !== ronda.dados.revisao;
            if (!ativa.pendente && !empresaId.value) {
              empresaId.value = ronda.dados.empresa_id;
              ativa.dados.empresa_id = ronda.dados.empresa_id;
            }
          }
        } catch (erro) { falhas.push(erro.message); }
      }
      if (enviou) nuvem = new Map((await Extintores.listar()).map(r => [r.id, r]));
      aviso(falhas.length ? 'Há rondas pendentes. ' + falhas[0] : 'Histórico sincronizado.');
    } catch (erro) {
      aviso('Sincronização indisponível. ' + erro.message);
    } finally {
      await listar();
    }
  })().catch(erro => aviso('Não foi possível acessar as rondas neste aparelho. ' + erro.message))
    .finally(() => { sincronizando = null; });
  return sincronizando;
}

$('nova-ronda').onclick = async () => {
  const botao = $('nova-ronda');
  botao.disabled = true;
  let itens;
  try {
    itens = await Extintores.carregarItens();

  const id = crypto.randomUUID();
  mostrarEditor({id, pendente: false, dados: {

    ...(itens ? {itens_extintores: itens} : {})
  }});
};
$('voltar-rondas').onclick = async () => {

  }
};
async function salvarGeral(evento) {
  const retorno = evento.currentTarget.id === 'salvar-geral-topo' ? $('aviso-salvar-topo') : $('aviso');
  $('aviso-salvar-topo').textContent = '';
  if (!ativa || $('campos').disabled || salvandoRonda || fotosEmProcessamento) return;
  if (!Extintores.possuiDados(coletar())) {
    retorno.textContent = 'Preencha os dados da inspeção antes de salvar.';
    return;
  }
  salvandoRonda = true;
  atualizarBotoesEditor();
  try {
    await sincronizando;
    await salvarLocal();
    retorno.textContent = 'Inspeção salva neste aparelho. Sincronizando histórico…';
    await sincronizar();
    if (!ativa.pendente) {
      retorno.textContent = 'Inspeção salva e sincronizada no histórico compartilhado.';
    } else if (!navigator.onLine) {
      retorno.textContent = 'Inspeção salva neste aparelho. A sincronização será retomada quando houver internet.';
    } else if (!dados.empresa_id) {
      retorno.textContent = 'Inspeção salva neste aparelho. Selecione uma empresa na lista para sincronizar.';
    } else if (conflitos.has(ativa.id)) {
      retorno.textContent = 'Inspeção salva neste aparelho. Há uma versão diferente no histórico. Volte à lista para conferir as opções.';
    } else {
      retorno.textContent = 'Inspeção salva neste aparelho. A sincronização continua pendente. ' + $('sync-status').textContent;
    }
  } catch {
    if (retorno !== $('aviso')) retorno.textContent = $('aviso').textContent;
  } finally {
    salvandoRonda = false;
    atualizarBotoesEditor();
  }
}

$('salvar').onclick = $('salvar-geral-topo').onclick = salvarGeral;
$('finalizar').onclick = async () => {
  if (!empresa.value.trim() || !dados.extintores.length) {
    $('aviso').textContent = 'Informe a empresa e adicione um extintor para finalizar.';
    return;
  }
  dados.status = 'finalizada';
  try {
    await salvarLocal();
    await mostrarGestao();
    await sincronizar();

};

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
