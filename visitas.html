<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a">
<title>Visitas SST | SST Vision</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a}.topo{background:#0f172a;color:#fff;padding:20px 18px}.wrap{max-width:980px;margin:auto}.topbar{display:flex;align-items:center;gap:14px}.voltar{color:#fff;text-decoration:none;font-size:22px}.topo h1{font-size:24px;margin:0}.topo p{margin:5px 0 0;color:#cbd5e1;font-size:14px}main{padding:18px}.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}.btn-primary{background:#0f172a;color:#fff}.btn-light{background:#fff;color:#0f172a;border:1px solid #cbd5e1}.painel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.painel h2{font-size:18px;margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.campo.full{grid-column:1/-1}.campo label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#475569}.campo input,.campo select,.campo textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}.campo textarea{min-height:82px;resize:vertical}.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filtros button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.filtros button.ativo{background:#0f172a;color:#fff;border-color:#0f172a}.vazio{padding:26px;text-align:center;color:#64748b}.visita{border:1px solid #e2e8f0;border-radius:13px;padding:14px;margin-top:10px}.visita-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.visita-top .tag{flex:0 0 auto;align-self:flex-start}.visita h3{margin:0 0 5px;font-size:16px}.meta{font-size:13px;color:#64748b;line-height:1.55}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#e2e8f0;font-size:11px;font-weight:700;white-space:nowrap}.tag.agendada{background:#dbeafe;color:#1e40af}.tag.realizada{background:#dcfce7;color:#166534}.tag.cancelada{background:#fee2e2;color:#991b1b}.visita-acoes{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.visita-acoes button,.visita-acoes a{font-size:12px;padding:7px 9px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;text-decoration:none;cursor:pointer}.nota{font-size:12px;color:#64748b;margin-top:12px;line-height:1.45}@media(max-width:640px){main{padding:14px}.form-grid{grid-template-columns:1fr}.campo.full{grid-column:auto}.form-actions{flex-direction:column}.form-actions .btn{width:100%;text-align:center}.visita-top{align-items:flex-start}}
</style>
</head>
<body>
<header class="topo"><div class="wrap topbar"><a class="voltar" href="./index.html">‹</a><div><h1>Visitas SST</h1><p>Agenda e acompanhamento de visitas técnicas</p></div></div></header>
<main class="wrap">
<div class="acoes"><button class="btn btn-primary" id="btnNova">＋ Nova visita</button></div>
<section class="painel" id="formPainel" hidden>
<h2 id="formTitulo">Nova visita</h2>
<form id="formVisita">
<input type="hidden" id="visitaId">
<div class="form-grid">
<div class="campo"><label for="empresa">Empresa / Fazenda *</label><input id="empresa" required placeholder="Nome da empresa ou propriedade"></div>
<div class="campo"><label for="local">Local / Unidade</label><input id="local" placeholder="Unidade, setor ou endereço"></div>
<div class="campo"><label for="data">Data *</label><input id="data" type="date" required></div>
<div class="campo"><label for="hora">Horário *</label><input id="hora" type="time" required></div>
<div class="campo"><label for="duracao">Duração prevista</label><select id="duracao"><option value="60">1 hora</option><option value="90">1h30</option><option value="120" selected>2 horas</option><option value="180">3 horas</option><option value="240">4 horas</option></select></div>
<div class="campo"><label for="tipo">Tipo de visita *</label><select id="tipo" required><option>Visita técnica</option><option>Inspeção de SST</option><option>Retorno / acompanhamento</option><option>Levantamento de riscos</option><option>Treinamento</option><option>Reunião</option><option>Outro</option></select></div>
<div class="campo full"><label for="objetivo">Objetivo *</label><textarea id="objetivo" required placeholder="Ex.: verificar adequações apontadas na visita anterior"></textarea></div>
<div class="campo"><label for="acompanhante">Responsável / acompanhante</label><input id="acompanhante" placeholder="Nome de quem acompanhará a visita"></div>
<div class="campo"><label for="status">Status</label><select id="status"><option>Agendada</option><option>Em andamento</option><option>Realizada</option><option>Relatório concluído</option><option>Cancelada</option></select></div>
<div class="campo full"><label for="observacoes">Observações</label><textarea id="observacoes" placeholder="Informações adicionais"></textarea></div>
</div>
<div class="form-actions"><button type="button" class="btn btn-light" id="cancelar">Cancelar</button><button class="btn btn-primary" type="submit">Salvar visita</button></div>
</form>
<p class="nota">Os registros desta primeira versão ficam armazenados neste dispositivo. A sincronização persistente com banco e Google Agenda será a próxima camada da integração.</p>
</section>
<section class="painel">
<h2>Agenda de visitas</h2>
<div class="filtros"><button class="ativo" data-filtro="todas">Todas</button><button data-filtro="proximas">Próximas</button><button data-filtro="realizadas">Realizadas</button></div>
<div id="lista"></div>
</section>
</main>
<script>
const KEY='sstVision.visitas.v1';let filtro='todas';
const $=id=>document.getElementById(id);
const ler=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};
const salvar=v=>localStorage.setItem(KEY,JSON.stringify(v));
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function abrir(v=null){$('formPainel').hidden=false;$('formTitulo').textContent=v?'Editar visita':'Nova visita';$('visitaId').value=v?.id||'';['empresa','local','data','hora','tipo','objetivo','acompanhante','status','observacoes','duracao'].forEach(k=>{if(v&&v[k]!=null)$(k).value=v[k]});if(!v){$('formVisita').reset();$('visitaId').value='';$('duracao').value='120';$('status').value='Agendada'}$('formPainel').scrollIntoView({behavior:'smooth'})}
function fechar(){$('formPainel').hidden=true;$('formVisita').reset()}
function dataBR(d){if(!d)return'';return d.split('-').reverse().join('/')}
function googleUrl(v){const ini=new Date(v.data+'T'+v.hora+':00');const fim=new Date(ini.getTime()+Number(v.duracao||120)*60000);const z=n=>String(n).padStart(2,'0');const fmt=d=>d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'T'+z(d.getHours())+z(d.getMinutes())+'00';const titulo='Visita SST - '+v.empresa;const detalhes=[v.tipo,v.objetivo,v.acompanhante?'Acompanhante: '+v.acompanhante:'',v.observacoes].filter(Boolean).join('\n');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(titulo)+'&dates='+fmt(ini)+'/'+fmt(fim)+'&details='+encodeURIComponent(detalhes)+'&location='+encodeURIComponent(v.local||'')}
function render(){let vs=ler().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));const hoje=new Date();hoje.setHours(0,0,0,0);if(filtro==='proximas')vs=vs.filter(v=>new Date(v.data+'T00:00:00')>=hoje&&!['Realizada','Relatório concluído','Cancelada'].includes(v.status));if(filtro==='realizadas')vs=vs.filter(v=>['Realizada','Relatório concluído'].includes(v.status));if(!vs.length){$('lista').innerHTML='<div class="vazio">Nenhuma visita encontrada.</div>';return}$('lista').innerHTML=vs.map(v=>'<article class="visita"><div class="visita-top"><div><h3>'+esc(v.empresa)+'</h3><div class="meta">'+dataBR(v.data)+' às '+esc(v.hora)+(v.local?' · '+esc(v.local):'')+'<br>'+esc(v.tipo)+'</div></div><span class="tag '+v.status.toLowerCase().replaceAll(' ','-').replaceAll('ó','o')+'">'+esc(v.status)+'</span></div><div class="meta" style="margin-top:9px"><strong>Objetivo:</strong> '+esc(v.objetivo)+'</div><div class="visita-acoes"><button onclick="editar(\''+v.id+'\')">Editar</button><a target="_blank" rel="noopener" href="'+googleUrl(v)+'">Google Agenda</a><a class="rv-link" href="./relatorio-visita.html?visita='+encodeURIComponent(v.id)+'">Gerar relatório</a><button onclick="remover(\''+v.id+'\')">Excluir</button></div></article>').join('')}
window.editar=id=>{const v=ler().find(x=>x.id===id);if(v)abrir(v)}
window.remover=id=>{if(!confirm('Excluir esta visita?'))return;salvar(ler().filter(x=>x.id!==id));render()}
$('btnNova').onclick=()=>abrir();$('cancelar').onclick=fechar;
$('formVisita').onsubmit=e=>{e.preventDefault();const id=$('visitaId').value||('v_'+Date.now());const v={id};['empresa','local','data','hora','duracao','tipo','objetivo','acompanhante','status','observacoes'].forEach(k=>v[k]=$(k).value.trim());const vs=ler();const i=vs.findIndex(x=>x.id===id);if(i>=0)vs[i]=v;else vs.push(v);salvar(vs);fechar();render()};
document.querySelectorAll('[data-filtro]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filtro]').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');filtro=b.dataset.filtro;render()});
if(location.hash==='#nova')abrir();render();
</script>
</body></html>
