<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Detalhe da análise | SST Vision</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a}.topo{background:#0f172a;color:#fff;padding:18px}.topo-inner,.conteudo{max-width:980px;margin:auto}.topo-linha{display:flex;gap:12px;align-items:center}.voltar{color:#fff;text-decoration:none;font-size:22px}.topo h1{margin:0;font-size:24px}.conteudo{padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.campo{background:#f8fafc;border-radius:12px;padding:12px}.campo small{display:block;color:#64748b;margin-bottom:4px}.fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.foto{background:#f8fafc;border-radius:14px;padding:10px}.foto img{width:100%;border-radius:10px;display:block}.achado{border-top:1px solid #e2e8f0;padding:12px 0}.achado:first-child{border-top:0;padding-top:0}.achado h3{margin:0 0 8px;font-size:16px}.meta{font-size:13px;color:#64748b;line-height:1.5}.erro,.carregando{text-align:center;padding:28px;color:#64748b}.erro{color:#991b1b}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:700;text-transform:capitalize}@media(max-width:640px){.grid,.fotos{grid-template-columns:1fr}.conteudo{padding:12px}}
  </style>
</head>
<body>
  <header class="topo"><div class="topo-inner"><div class="topo-linha"><a class="voltar" href="./analises.html" aria-label="Voltar">←</a><div><h1>Detalhe da análise</h1></div></div></div></header>
  <main class="conteudo"><div id="resultado" class="carregando">Carregando análise...</div></main>
  <script>
    const API='https://sst-vision.onrender.com';
    const resultado=document.getElementById('resultado');
    const id=new URLSearchParams(location.search).get('id');
    function esc(v){return String(v??'-').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
    function dataBR(v){if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString('pt-BR');}
    async function carregar(){if(!id){resultado.className='erro';resultado.textContent='Análise não informada.';return;}try{const r=await fetch(`${API}/analises/${encodeURIComponent(id)}`);const d=await r.json();if(!r.ok)throw new Error(d.mensagem||'Falha ao carregar análise.');const a=d.analise||{};const fotos=Array.isArray(d.fotos)?d.fotos:[];const achados=Array.isArray(d.achados)?d.achados:[];resultado.className='';resultado.innerHTML=`
      <section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2 style="margin:0 0 6px">${esc(a.empresa)}</h2><div class="meta">Análise #${esc(a.id)}</div></div><span class="status">${esc(a.status||'validada')}</span></div><div class="grid" style="margin-top:14px"><div class="campo"><small>Local / setor</small>${esc(a.setor)}</div><div class="campo"><small>Equipamento</small>${esc(a.equipamento||a.identificacao_descricao)}</div><div class="campo"><small>Tipo de análise</small>${esc(a.tipo_analise)}</div><div class="campo"><small>Data</small>${esc(dataBR(a.validada_em||a.criado_em))}</div></div>${a.observacao?`<div class="campo" style="margin-top:10px"><small>Observação</small>${esc(a.observacao)}</div>`:''}</section>
      <section class="card"><h2 style="margin-top:0">Fotos</h2>${fotos.length?`<div class="fotos">${fotos.map(f=>`<div class="foto"><div class="meta" style="margin-bottom:6px">Foto ${esc(f.ordem)}</div>${f.url?`<img src="${esc(f.url)}" alt="Foto da análise">`:'<div class="meta">Imagem indisponível.</div>'}</div>`).join('')}</div>`:'<div class="meta">Nenhuma foto encontrada.</div>'}</section>
      <section class="card"><h2 style="margin-top:0">Achados</h2>${achados.length?achados.map(ac=>`<div class="achado"><h3>${esc(ac.numero)}. ${esc(ac.titulo)}</h3><div class="meta"><strong>Observado:</strong> ${esc(ac.observado)}<br><strong>Possível risco:</strong> ${esc(ac.possivel_risco)}<br><strong>Confiança:</strong> ${esc(ac.confianca)} · <strong>Origem:</strong> ${esc(ac.origem)}</div></div>`).join(''):'<div class="meta">Nenhum achado registrado.</div>'}</section>`;}catch(e){resultado.className='erro';resultado.textContent=e.message||'Não foi possível carregar a análise.';}}
    carregar();
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
  </script>
</body>
</html>
